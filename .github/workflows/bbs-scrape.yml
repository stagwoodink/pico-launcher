name: bbs-scrape

on:
  schedule:
    - cron: "17 4 * * *" # daily, off the hour to avoid GH's peak-minute pile-up
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go run ./cmd/bbs-scraper -out carts.json
      - run: |
          git add carts.json
          if git diff --cached --quiet -- carts.json; then
            echo "carts.json unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(bbs): refresh carts.json"
          git push
